name: Vigilar leyes y publicar la web

# Cada día comprueba si han cambiado las normas del BOE en las que se basa el temario,
# guarda las novedades, abre un aviso (issue) si hay cambios nuevos y vuelve a publicar la web
# en GitHub Pages. También se ejecuta al subir cambios y a mano (pestaña Actions > Run workflow).
on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC cada día (07:17 en España en verano, 06:17 en invierno)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "datos/**"
      - "herramientas/**"
      - ".github/workflows/**"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar cambios en las leyes (BOE)
        id: vigilar
        run: python -I herramientas/vigilar_leyes.py

      - name: Guardar las novedades en el repositorio
        run: |
          git config user.name "vigilante-leyes"
          git config user.email "actions@users.noreply.github.com"
          git add datos/novedades.json datos/vigilancia
          if ! git diff --cached --quiet; then
            git commit -m "Vigilancia de leyes: novedades detectadas"
            git push
          fi

      - name: Avisar con un issue si hay cambios nuevos
        if: steps.vigilar.outputs.nuevas != '' && steps.vigilar.outputs.nuevas != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create novedades-leyes --description "Cambios en las leyes del temario" --color D93F0B --force
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/#novedades"
          {
            cat novedades-resumen.md
            echo
            echo "Ver las novedades en la web: $URL"
          } > cuerpo-issue.md
          gh issue create \
            --title "Novedades legislativas: ${{ steps.vigilar.outputs.nuevas }} cambio(s) en las leyes del temario" \
            --label novedades-leyes \
            --body-file cuerpo-issue.md

      - name: Generar la web
        run: |
          python -I herramientas/build.py
          python -I herramientas/empaquetar.py

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
