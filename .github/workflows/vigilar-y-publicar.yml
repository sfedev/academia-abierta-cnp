name: Vigilar leyes y publicar la web

# Cada día comprueba si han cambiado las normas del BOE en las que se basa el temario,
# guarda las novedades, abre un aviso (issue) si hay cambios nuevos y vuelve a publicar la web
# en GitHub Pages. También se ejecuta al subir cambios y a mano (pestaña Actions > Run workflow).
on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC cada día (07:17 en España en verano, 06:17 en invierno)
  workflow_dispatch:
    inputs:
      probar_aviso:
        description: "Crear un issue de prueba para comprobar que llegan los avisos"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "web/**"
      - "datos/**"
      - "herramientas/**"
      - ".github/workflows/**"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar cambios en las leyes (BOE)
        id: vigilar
        run: python -I herramientas/vigilar_leyes.py

      - name: Vigilar la convocatoria de Escala Básica (BOE)
        # Lee los sumarios diarios del BOE; si sale la convocatoria nueva, compara su Anexo I con el temario actual.
        id: convocatoria
        run: python -I herramientas/vigilar_convocatoria.py

      - name: Guardar las novedades en el repositorio
        run: |
          git config user.name "vigilante-leyes"
          git config user.email "actions@users.noreply.github.com"
          git add datos/novedades.json datos/vigilancia
          if ! git diff --cached --quiet; then
            git commit -m "Vigilancia de leyes y convocatoria: novedades detectadas"
            git push
          fi

      - name: Avisar con un issue si sale la convocatoria
        if: steps.convocatoria.outputs.nueva == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create convocatoria --description "Nueva convocatoria de Escala Básica" --color 1D76DB --force
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/#novedades"
          {
            cat convocatoria-resumen.md
            echo
            echo "Ver la comparación del temario en la web: $URL"
          } > cuerpo-convocatoria.md
          gh issue create \
            --title "Nueva convocatoria de Escala Básica publicada en el BOE" \
            --label convocatoria \
            --body-file cuerpo-convocatoria.md

      - name: Mantener activo el programador
        # GitHub desactiva los workflows programados de un repositorio público tras 60 días sin actividad.
        # Si el último commit tiene más de 40 días, se añade uno vacío para que la vigilancia no se apague.
        run: |
          ultimo=$(git log -1 --format=%ct)
          ahora=$(date +%s)
          if [ $(( (ahora - ultimo) / 86400 )) -ge 40 ]; then
            git config user.name "vigilante-leyes"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "Mantener activo el programador de la vigilancia"
            git push
          fi

      - name: Avisar con un issue si hay cambios nuevos
        if: steps.vigilar.outputs.nuevas != '' && steps.vigilar.outputs.nuevas != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create novedades-leyes --description "Cambios en las leyes del temario" --color D93F0B --force
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/#novedades"
          {
            cat novedades-resumen.md
            echo
            echo "Ver las novedades en la web: $URL"
          } > cuerpo-issue.md
          gh issue create \
            --title "Novedades legislativas: ${{ steps.vigilar.outputs.nuevas }} cambio(s) en las leyes del temario" \
            --label novedades-leyes \
            --body-file cuerpo-issue.md

      - name: Probar el aviso (solo si se pide a mano)
        if: github.event_name == 'workflow_dispatch' && inputs.probar_aviso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create novedades-leyes --description "Cambios en las leyes del temario" --color D93F0B --force
          gh issue create \
            --title "Prueba de aviso: así llegará una novedad legislativa" \
            --label novedades-leyes \
            --body "Este es un aviso de prueba. Cuando el BOE cambie una ley del temario, recibirás un issue como este con la lista de cambios y el enlace a la pestaña Novedades de la web: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/#novedades. Puedes cerrarlo."

      - name: Validar las fichas
        # Si una ficha tiene errores de formato (opciones, claves, tablas...), no se publica. Los avisos no bloquean.
        # Va después de guardar las novedades para que un error de formato no impida registrar los cambios legales.
        run: python -I herramientas/validar_tema.py datos/temas/tema-*.json

      - name: Generar la web
        run: |
          python -I herramientas/build.py
          python -I herramientas/empaquetar.py

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
